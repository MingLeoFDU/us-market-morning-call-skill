name: Daily Feishu Morning Call

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Trigger at both possible UTC times for 06:30 New York
    # across daylight/standard time, then gate inside the job.
    - cron: "30 10,11 * * 1-5"

jobs:
  send-morning-call:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check New York delivery window
        id: ny-time
        if: github.event_name == 'schedule'
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const parts = new Intl.DateTimeFormat('en-US', {
            timeZone: 'America/New_York',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false,
          }).formatToParts(new Date());
          const get = (type) => parts.find((part) => part.type === type).value;
          const hhmm = `${get('hour')}:${get('minute')}`;
          const minutes = Number(get('hour')) * 60 + Number(get('minute'));
          const shouldRun = minutes >= 390 && minutes < 450;
          console.log(shouldRun ? `Continue: New York time is ${hhmm}.` : `Skip: New York time is ${hhmm}, outside 06:30-07:29.`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_run=${shouldRun}\n`);
          NODE

      - name: Generate and send AI research card
        if: github.event_name == 'workflow_dispatch' || steps.ny-time.outputs.should_run == 'true'
        env:
          ANALYST: ${{ vars.ANALYST || 'Leo' }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          FEISHU_RECEIVE_ID_TYPE: ${{ secrets.FEISHU_RECEIVE_ID_TYPE }}
          EARNINGS_MOVERS_JSON: ${{ secrets.EARNINGS_MOVERS_JSON }}
        run: node scripts/run_daily_agent.js

      - name: Upload generated PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-market-morning-call
          path: |
            output/*.pdf
            data/*.json
