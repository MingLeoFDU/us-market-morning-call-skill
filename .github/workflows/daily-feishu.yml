name: Daily Feishu Morning Call

on:
  workflow_dispatch:
  schedule:
    # 10:30 UTC = 06:30 New York (US DST) / 18:30 Beijing.
    # Same UTC slot as daily-ficc-feishu.yml but different market focus (US vs CN).
    - cron: "30 10 * * 1-5"

jobs:
  send-morning-call:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate and send Macro Daily Signal
        env:
          ANALYST: ${{ vars.ANALYST || 'Leo' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          FEISHU_RECEIVE_ID_TYPE: ${{ secrets.FEISHU_RECEIVE_ID_TYPE }}
          EARNINGS_MOVERS_JSON: ${{ secrets.EARNINGS_MOVERS_JSON }}
        run: node scripts/run_daily_agent.js

      - name: Upload generated PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-daily-signal
          path: |
            output/*.md
            data/*.json
