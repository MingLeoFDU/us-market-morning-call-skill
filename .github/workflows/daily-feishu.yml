name: Daily Feishu Morning Call

on:
  workflow_dispatch:
  schedule:
    # 06:30 New York time, Monday-Friday.
    - cron: "30 6 * * 1-5"
      timezone: "America/New_York"

jobs:
  send-morning-call:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate and send AI research card
        env:
          ANALYST: ${{ vars.ANALYST || 'Leo' }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          FEISHU_RECEIVE_ID_TYPE: ${{ secrets.FEISHU_RECEIVE_ID_TYPE }}
          EARNINGS_MOVERS_JSON: ${{ secrets.EARNINGS_MOVERS_JSON }}
        run: node scripts/run_daily_agent.js

      - name: Upload generated PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-market-morning-call
          path: |
            output/*.pdf
            data/*.json
