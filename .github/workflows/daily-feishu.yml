name: Daily Feishu Morning Call

on:
  workflow_dispatch:
  schedule:
    # 06:30 New York time is 10:30 UTC during US daylight time.
    # Adjust this cron if you want a different delivery time.
    - cron: "30 10 * * 1-5"

jobs:
  send-morning-call:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate and send PDF
        env:
          ANALYST: ${{ vars.ANALYST || 'Leo' }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          FEISHU_RECEIVE_ID_TYPE: ${{ secrets.FEISHU_RECEIVE_ID_TYPE }}
          EARNINGS_MOVERS_JSON: ${{ secrets.EARNINGS_MOVERS_JSON }}
        run: node scripts/run_daily_agent.js
