name: Daily FICC Desk English

on:
  workflow_dispatch:
  schedule:
    # 08:45 Asia/Shanghai every day
    - cron: "45 0 * * *"

jobs:
  send-ficc-desk-english:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Generate and send Feishu card
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > /tmp/ficc_desk_english.py <<'PY'
          import html
          import json
          import os
          import re
          import sys
          import textwrap
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta

          import requests

          FEISHU_WEBHOOK_URL = os.environ.get("FEISHU_WEBHOOK_URL", "").strip()
          GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          GEMINI_MODEL = os.environ.get("GEMINI_MODEL", "gemini-1.5-flash")
          TZ = timezone(timedelta(hours=8))

          FEEDS = [
              ("Bloomberg Markets", "https://feeds.bloomberg.com/markets/news.rss"),
              ("Bloomberg Economics", "https://feeds.bloomberg.com/economics/news.rss"),
              ("Financial Times Markets", "https://www.ft.com/markets?format=rss"),
              ("ING Think", "https://think.ing.com/rss/"),
          ]

          FALLBACK_ENTRIES = [
              {
                  "title": "receive fixed（收固定）",
                  "english": "The desk prefers to **receive fixed** in five-year swaps after the rates selloff pushed front-end pricing too far.",
                  "translation": "在利率抛售把前端定价推得过头之后，交易台倾向于在五年期互换上收固定利率。",
                  "source": "FICC fallback",
                  "source_url": "https://www.bloomberg.com/markets/rates-bonds",
              },
              {
                  "title": "bear flattening（熊平）",
                  "english": "The curve moved into a **bear flattening** as short-end yields rose faster than the long end after the policy surprise.",
                  "translation": "政策意外之后，短端收益率比长端升得更快，收益率曲线走出熊平。",
                  "source": "FICC fallback",
                  "source_url": "https://www.bloomberg.com/markets/rates-bonds",
              },
              {
                  "title": "carry and roll-down（票息收益与曲线下滑收益）",
                  "english": "Investors are adding duration where **carry and roll-down** still compensate for rate volatility.",
                  "translation": "在票息收益与曲线下滑收益仍足以补偿利率波动的期限点，投资者正在增加久期。",
                  "source": "FICC fallback",
                  "source_url": "https://www.bloomberg.com/markets/rates-bonds",
              },
              {
                  "title": "cross-currency basis（交叉货币基差）",
                  "english": "The **cross-currency basis** widened as dollar funding demand picked up into month-end.",
                  "translation": "随着月末美元融资需求上升，交叉货币基差走阔。",
                  "source": "FICC fallback",
                  "source_url": "https://www.bloomberg.com/markets/currencies",
              },
              {
                  "title": "swap spread（互换利差）",
                  "english": "Ten-year **swap spreads** tightened as Treasury supply cheapened cash bonds against swaps.",
                  "translation": "由于美国国债供给使现券相对互换变便宜，十年期互换利差收窄。",
                  "source": "FICC fallback",
                  "source_url": "https://www.bloomberg.com/markets/rates-bonds",
              },
          ]

          BAD_GENERIC = {
              "support", "weigh on", "bolster", "concern", "concerns", "investors", "markets",
              "market", "stocks", "gain", "rise", "fall", "slump", "jump", "rally", "selloff",
              "volatile", "volatility", "pressure", "risk", "outlook", "data", "policy",
          }

          def strip_tags(text):
              text = re.sub(r"<[^>]+>", " ", text or "")
              text = html.unescape(text)
              return re.sub(r"\s+", " ", text).strip()

          def fetch_feed(source, url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = resp.read()
              root = ET.fromstring(data)
              items = []
              for item in root.findall(".//item")[:25]:
                  title = strip_tags(item.findtext("title"))
                  desc = strip_tags(item.findtext("description"))
                  link = strip_tags(item.findtext("link"))
                  if title:
                      items.append({"source": source, "title": title, "summary": desc, "url": link})
              return items

          def collect_items():
              items = []
              for source, url in FEEDS:
                  try:
                      got = fetch_feed(source, url)
                      print(f"FEED_OK source={source!r} items={len(got)}")
                      items.extend(got)
                  except Exception as exc:
                      print(f"FEED_FAIL source={source!r} error={exc}")
              return items[:80]

          def gemini_generate(items):
              if not GEMINI_API_KEY:
                  raise RuntimeError("GEMINI_API_KEY is not configured")

              compact_items = []
              for i, item in enumerate(items[:60], 1):
                  compact_items.append({
                      "id": i,
                      "source": item["source"],
                      "headline": item["title"][:220],
                      "summary": item["summary"][:360],
                      "url": item["url"],
                  })

              prompt = f"""
              你是外资行 FICC trading desk 的英语教练，服务对象是中文母语的 FICC/宏观/固收/外汇/商品交易与研究人员。

              请从下面这些最新英文财经新闻中，挑选 exactly 5 个真正适合交易台学习的英文表达。

              选择标准必须严格：
              1. 必须是 FICC 实务常用表达，优先 rates, FX, credit, commodities, funding, curve, swaps, basis, duration, spreads, issuance, liquidity, positioning, hedging, central-bank reaction function。
              2. 不要选泛泛新闻词或普通动词，例如 support, weigh on, bolster, concern, investors, markets, rise, fall, rally, slump, pressure, volatility, policy, data。
              3. 每个表达必须来自一条英文原文句子；如果新闻标题不够完整，可用标题加摘要形成一句自然英文。
              4. title 格式必须是：英文表达（准确中文译名）。例如 receive fixed（收固定）、bear flattening（熊平）。
              5. english 必须是一句英文原文或近原文，且必须用 Markdown **加粗**命中的英文表达。
              6. translation 必须是 english 这一整句的准确、自然中文翻译，不要写“这句话的交易台含义是”。
              7. 不要编造新闻事实；可以轻微整理摘要为通顺句，但必须忠于原意。
              8. 输出只允许是 JSON array，不要解释。

              JSON schema:
              [
                {{"title":"expression（中文）","english":"... **expression** ...","translation":"...","source":"...","source_url":"..."}}
              ]

              News items:
              {json.dumps(compact_items, ensure_ascii=False)}
              """

              endpoint = f"https://generativelanguage.googleapis.com/v1beta/models/{GEMINI_MODEL}:generateContent?key={GEMINI_API_KEY}"
              payload = {
                  "contents": [{"role": "user", "parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "temperature": 0.15,
                      "topP": 0.8,
                      "responseMimeType": "application/json",
                  },
              }
              resp = requests.post(endpoint, json=payload, timeout=45)
              if resp.status_code >= 400:
                  raise RuntimeError(f"Gemini HTTP {resp.status_code}: {resp.text[:500]}")
              data = resp.json()
              text = data["candidates"][0]["content"]["parts"][0]["text"]
              return json.loads(text)

          def normalize_entries(entries):
              if not isinstance(entries, list):
                  raise ValueError("Gemini did not return a list")
              cleaned = []
              for raw in entries:
                  item = {
                      "title": str(raw.get("title", "")).strip(),
                      "english": str(raw.get("english", "")).strip(),
                      "translation": str(raw.get("translation", "")).strip(),
                      "source": str(raw.get("source", "")).strip() or "Market news",
                      "source_url": str(raw.get("source_url", "")).strip(),
                  }
                  cleaned.append(item)
              return cleaned

          def quality_gate(entries):
              if len(entries) != 5:
                  raise ValueError(f"Need exactly 5 entries, got {len(entries)}")
              for idx, item in enumerate(entries, 1):
                  title = item["title"]
                  english = item["english"]
                  translation = item["translation"]
                  if not title or "（" not in title or "）" not in title:
                      raise ValueError(f"Entry {idx} title format is weak: {title}")
                  if "**" not in english:
                      raise ValueError(f"Entry {idx} missing bold term")
                  if len(translation) < 12 or "交易台含义" in translation:
                      raise ValueError(f"Entry {idx} translation is not a real sentence")
                  title_key = title.split("（", 1)[0].strip().lower()
                  if title_key in BAD_GENERIC or any(title_key == bad for bad in BAD_GENERIC):
                      raise ValueError(f"Entry {idx} is too generic: {title_key}")
                  if len(title_key.split()) == 1 and title_key not in {"duration", "basis"}:
                      raise ValueError(f"Entry {idx} is probably too broad: {title_key}")
              return entries

          def make_markdown(entries, mode):
              date_str = datetime.now(TZ).strftime("%Y-%m-%d")
              lines = [f"**FICC Desk English｜{date_str}**"]
              if mode != "gemini":
                  lines.append("_Gemini 输出未通过质量检查，今日使用人工校准备用表达。_")
              for i, item in enumerate(entries, 1):
                  lines.extend([
                      "",
                      f"**{i}. {item['title']}**",
                      item["english"],
                      item["translation"],
                  ])
                  if item.get("source"):
                      lines.append(f"来源：{item['source']}")
              return "\n".join(lines)

          def send_feishu(markdown):
              if not FEISHU_WEBHOOK_URL:
                  raise RuntimeError("FEISHU_WEBHOOK_URL is not configured")
              payload = {
                  "msg_type": "interactive",
                  "card": {
                      "config": {"wide_screen_mode": True},
                      "header": {
                          "title": {"tag": "plain_text", "content": "FICC Desk English"},
                          "template": "blue",
                      },
                      "elements": [{"tag": "markdown", "content": markdown}],
                  },
              }
              resp = requests.post(FEISHU_WEBHOOK_URL, json=payload, timeout=20)
              print(f"FEISHU_STATUS={resp.status_code} {resp.text[:300]}")
              resp.raise_for_status()

          def main():
              items = collect_items()
              mode = "gemini"
              try:
                  if not items:
                      raise RuntimeError("No RSS items collected")
                  entries = quality_gate(normalize_entries(gemini_generate(items)))
              except Exception as exc:
                  print(f"QUALITY_FALLBACK reason={exc}", file=sys.stderr)
                  mode = "fallback"
                  entries = FALLBACK_ENTRIES
              print("SELECTED_ENTRIES=" + json.dumps(entries, ensure_ascii=False, indent=2))
              markdown = make_markdown(entries, mode)
              print("CARD_MARKDOWN_PREVIEW=" + markdown[:1600])
              send_feishu(markdown)

          if __name__ == "__main__":
              main()
          PY
          python /tmp/ficc_desk_english.py
