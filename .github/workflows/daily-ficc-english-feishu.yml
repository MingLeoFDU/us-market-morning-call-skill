name: Daily FICC Desk English

on:
  workflow_dispatch:
  schedule:
    # 3 attempts: 08:45, 09:30, 10:15 Asia/Shanghai (weekdays).
    # The job uses a daily cache marker so only the first successful run sends.
    - cron: "45 0 * * 1-5"
    - cron: "30 1 * * 1-5"
    - cron: "15 2 * * 1-5"

concurrency:
  group: ficc-desk-english-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-ficc-desk-english:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute daily sent key
        id: sent-date
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Check Beijing delivery window
        id: delivery-window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: bypassing delivery window."
            exit 0
          fi

          now_hm="$(TZ=Asia/Shanghai date +%H%M)"
          if [ "$now_hm" -ge 0840 ] && [ "$now_hm" -le 1330 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Inside Beijing delivery window: $now_hm."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Outside Beijing delivery window: $now_hm."
          fi

      - name: Restore daily sent marker
        id: sent-cache
        if: steps.delivery-window.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: .ficc_english_sent_marker
          key: ficc-english-sent-${{ steps.sent-date.outputs.date }}

      - name: Skip outside delivery window
        if: steps.delivery-window.outputs.should_run != 'true'
        run: echo "Outside Beijing delivery window; not sending today yet."

      - name: Skip if already sent today
        if: steps.delivery-window.outputs.should_run == 'true' && steps.sent-cache.outputs.cache-hit == 'true'
        run: echo "FICC Desk English card already sent for ${{ steps.sent-date.outputs.date }}."

      - name: Set up Python
        if: steps.delivery-window.outputs.should_run == 'true' && steps.sent-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.delivery-window.outputs.should_run == 'true' && steps.sent-cache.outputs.cache-hit != 'true'
        run: python -m pip install --upgrade requests

      - name: Generate and send Feishu card
        if: steps.delivery-window.outputs.should_run == 'true' && steps.sent-cache.outputs.cache-hit != 'true'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python daily_ficc_push/ficc_desk_english.py
          mkdir -p .ficc_english_sent_marker
          echo "sent $(TZ=Asia/Shanghai date '+%F %T %Z')" > ".ficc_english_sent_marker/${{ steps.sent-date.outputs.date }}.ok"
