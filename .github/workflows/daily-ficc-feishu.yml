name: Daily FICC Feishu

on:
  workflow_dispatch:
  schedule:
    # 18:30 Asia/Shanghai, Monday-Friday.
    - cron: "30 10 * * 1-5"

jobs:
  send-ficc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests pillow

      - name: Generate and send FICC daily
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python daily_ficc_push/run_daily_ficc_agent.py

      - name: Upload FICC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ficc-daily
          path: daily_ficc_push/outputs/**
